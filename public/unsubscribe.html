<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribe from CEO Advantage Newsletter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <div class="unsubscribe-panel">
      <h1>Unsubscribe from CEO Advantage</h1>
      <p>We're sorry to see you go. Enter your email address to unsubscribe.</p>

      <form id="unsubscribeForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <button type="submit" class="submit-btn">Unsubscribe</button>
      </form>

      <div id="message" class="message"></div>
    </div>
  </div>

  <script src="unsubscribe.js"></script>
</body>
</html>
